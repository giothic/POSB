<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard BI</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">Dashboard de Produtos</h1>

    <!-- FORM -->
    <form method="POST" action="index.php" class="mb-5">

        <div class="row">

            <div class="col-md-4">
                <input type="text" name="nome" class="form-control" placeholder="Nome do produto" required>
            </div>

            <div class="col-md-3">
                <input type="number" step="0.01" name="preco" class="form-control" placeholder="Preço" required>
            </div>

            <div class="col-md-3">
                <input type="number" step="0.01" name="venda" class="form-control" placeholder="Valor vendido" required>
            </div>

            <div class="col-md-2">
                <button class="btn btn-primary w-100">Adicionar</button>
            </div>

        </div>

    </form>

    <!-- RESULTADO -->
    <div class="row">
        {{CARD}}
    </div>

</div>

</body>
</html>
